<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlohaTours - Windows Vista Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container"></div>

    <div class="window-container aero-glass">
        <header class="aero-header">
            <div class="window-controls">
                <span class="control minimize"></span>
                <span class="control maximize"></span>
                <span class="control close"></span>
            </div>
            <h1>AlohaTours 🌴</h1>
            <div class="auth-panel" id="auth-section">
                <button class="aero-btn" onclick="showLogin()">Вход</button>
                <button class="aero-btn" onclick="showRegister()">Регистрация</button>
            </div>
            <div class="auth-panel" id="user-section" style="display: none;">
                <span id="user-name" class="glow-text"></span>
                <button class="aero-btn" onclick="logout()">Выход</button>
            </div>
        </header>

        <main class="window-content">
            <div class="toolbar aero-glass-light">
                <h2>Каталог туров</h2>
                <div class="filters">
                    <input type="text" id="countryFilter" class="aero-input" placeholder="Поиск по стране..." oninput="filterTours()">
                </div>
            </div>

            <div id="tours-container" class="tours-grid">
                <!-- Туры будут загружены сюда -->
            </div>
        </main>
        
        <footer class="aero-footer">
            <p>AlohaTours © 2007 - 2026. Vaporwave & Vista Edition.</p>
        </footer>
    </div>

    <!-- Модальное окно Входа (Aero Glass) -->
    <div id="loginModal" class="modal">
        <div class="modal-content aero-glass">
            <div class="modal-header">
                <h2>Вход в систему</h2>
                <span class="close-modal" onclick="closeModals()">×</span>
            </div>
            <div class="modal-body">
                <input type="email" id="loginEmail" class="aero-input" placeholder="Email">
                <input type="password" id="loginPassword" class="aero-input" placeholder="Пароль">
                <div class="modal-actions">
                    <button class="aero-btn primary" onclick="login()">Войти</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно Регистрации (Aero Glass) -->
    <div id="registerModal" class="modal">
        <div class="modal-content aero-glass">
            <div class="modal-header">
                <h2>Регистрация</h2>
                <span class="close-modal" onclick="closeModals()">×</span>
            </div>
            <div class="modal-body">
                <input type="text" id="regName" class="aero-input" placeholder="ФИО">
                <input type="email" id="regEmail" class="aero-input" placeholder="Email">
                <input type="password" id="regPassword" class="aero-input" placeholder="Пароль">
                <div class="modal-actions">
                    <button class="aero-btn primary" onclick="register()">Зарегистрироваться</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
